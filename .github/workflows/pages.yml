# Deploys https://passtunnel.github.io/: the PassTunnel website from site/ of PassTunnel/passtunnel,
# together with the few files of this repository. Runs on every push to main and by hand
# (Actions → Pages → Run workflow, on main).
#
# site.ref holds the commit of PassTunnel/passtunnel whose site/ is published (one full SHA). The
# site.yml workflow of that repository writes it after every push to its main that touches site/; to
# publish another commit by hand, change site.ref here. The build job checks out site/ and
# scripts/check-site.sh at that commit (sparse, read-only), runs the checks, and assembles _site from
# site/ plus this repository's extras: the Search Console verification file (google*.html) and
# passtunnel/, a redirect from the old address /passtunnel/ to / that keeps the #section. An extra
# never replaces a file of site/; the build fails instead. Only the deploy job may write to Pages.
#
# Repository settings: Pages → Source → GitHub Actions, and the environment "github-pages" must allow
# deployments from main. PassTunnel/passtunnel pushes site.ref with a write deploy key of this
# repository (its secret SITE_DEPLOY_KEY).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read site.ref
        id: ref
        run: |
          [[ -f site.ref ]] || { echo "::error::site.ref is missing"; exit 1; }
          sha="$(<site.ref)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::site.ref must hold one full commit SHA of PassTunnel/passtunnel"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Site::PassTunnel/passtunnel@${sha::12}"

      # Non-cone mode, so the patterns may name a single file and the app repository's root files
      # stay out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PassTunnel/passtunnel
          ref: ${{ steps.ref.outputs.sha }}
          path: app
          persist-credentials: false
          sparse-checkout: |
            /site/
            /scripts/check-site.sh
          sparse-checkout-cone-mode: false

      - name: Check the site
        run: app/scripts/check-site.sh app/site

      - name: Assemble the site
        run: |
          shopt -s failglob
          mkdir _site
          cp -R app/site/. _site/
          for extra in google*.html passtunnel; do
            if [[ -e "_site/$extra" ]]; then
              echo "::error::$extra would replace site/$extra of PassTunnel/passtunnel"
              exit 1
            fi
            cp -R "$extra" _site/
          done
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write          # publish the artifact to Pages
      id-token: write       # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
